<main class="page">
  <header>
    <h1>{{ title() }}</h1>
    <p>
      @if (loading()) {
        Loading saved listings…
      }
    </p>
  </header>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <section class="map-panel" aria-label="annonces">
    <div #map class="map" role="application"></div>
  </section>
</main>
